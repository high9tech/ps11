<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIGH TECH PS - Maintenance & Jailbreak</title>
    <style>
        :root {
            /* تم تغيير لون الخلفية الأساسي ليكون شفافاً ليسمح بظهور الصورة */
            --bg-color: transparent;
            /* جعلنا لون الحاوية شبه شفاف لضمان قراءة النصوص بوضوح فوق الصورة */
            --container-bg: rgba(11, 17, 34, 0.85); /* تم تعديل الشفافية إلى 0.85 */
            --accent-color: #0070d2;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            /* إضافة تأثير ضبابي خفيف على الخلفية لجعل العناصر تبرز */
            --backdrop-blur: blur(5px);
        }
        body {
            /* إعدادات الخلفية الجديدة */
            background-image: url('background_full.jpg'); /* تأكد من وجود الصورة بهذا الاسم */
            background-size: cover; /* تغطية الشاشة بالكامل */
            background-position: center; /* توسيط الصورة */
            background-repeat: no-repeat; /* عدم تكرار الصورة */
            background-attachment: fixed; /* تثبيت الخلفية عند التمرير */
            
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .hero-banner {
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .hero-banner img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 3px solid rgba(255, 255, 255, 0.1);
        }

        .container {
            background-color: var(--container-bg);
            /* تطبيق تأثير الضبابي على الخلفية */
            backdrop-filter: var(--backdrop-blur);
            -webkit-backdrop-filter: var(--backdrop-blur);
            
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 { margin: 0 0 10px 0; font-size: 2rem; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.3s;
        }

        .menu-item:hover {
            background: rgba(0, 112, 210, 0.15);
        }

        .item-label { font-weight: bold; font-size: 1.1rem; }

        .btn-action {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-action:hover {
            background-color: #005cb3;
            transform: scale(1.05);
        }

        .console-box {
            background-color: rgba(0, 0, 0, 0.7); /* خلفية شفافة للـ Console */
            padding: 15px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            margin-top: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="hero-banner">
        <img src="background.png" alt="HIGH TECH STORE LOGO">
    </div>
    <div class="container">
        <h1>HIGH TECH PS</h1>
        <div class="subtitle">PlayStation Maintenance & Software Solutions</div>
        <div class="menu-section">
            <div class="menu-item">
                <span class="item-label">gold Henl</span>
                <button class="btn-action" onclick="logAction('netctrl')">Run</button>
            </div>
            <div class="menu-item">
                <span class="item-label">Auto Jailbreak</span>
                <button class="btn-action" onclick="logAction('jailbreak')">Trigger</button>
            </div>
        </div>
        <div class="console-box" id="consoleBox">
            <div id="logs">[-] Core initialized. Ready.</div>
        </div>
    </div>
    <script>
        function logAction(type) {
            const logDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<br>[${timestamp}] [+] Executing ${type}... <span style="color:#00e676">Done.</span>`;
            // Scroll to bottom of console
            const consoleBox = document.getElementById('consoleBox');
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
